<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تطبيق صرافة اليمن</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="صرافة اليمن">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Tajawal', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        button, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- شريط تنبيه التثبيت على الشاشة الرئيسية -->
    <div id="install-banner" class="hidden bg-brand-600 text-white p-3 text-xs flex justify-between items-center px-4 sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-mobile-screen text-base"></i>
            <span>تثبيت تطبيق صرافة اليمن على شاشة الهاتف؟</span>
        </div>
        <div class="flex gap-2">
            <button onclick="installApp()" class="bg-white text-brand-700 px-3 py-1 rounded-lg font-bold shadow-xs active:scale-95">تثبيت</button>
            <button onclick="dismissInstall()" class="text-emerald-100 p-1"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- رأس التطبيق -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 py-3 px-4 sticky top-0 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-xs">
                    <i class="fa-solid fa-wallet text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-tight">أسعار الصرف اليمنية</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400" id="last-updated">جاري التحديث...</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="fetchLiveRates()" class="p-2 bg-slate-100 dark:bg-slate-800 active:scale-95 rounded-xl transition text-slate-600 dark:text-slate-300" title="تحديث">
                    <i class="fa-solid fa-rotate text-sm" id="refresh-icon"></i>
                </button>
                <button onclick="toggleDarkMode()" class="p-2 bg-slate-100 dark:bg-slate-800 active:scale-95 rounded-xl transition text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="max-w-md w-full mx-auto p-3 sm:p-4 flex-grow space-y-3.5 pb-8">

        <!-- أسعار السوق -->
        <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-xs text-slate-700 dark:text-slate-300">🏛️ صنعاء</span>
                    <span class="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[10px] px-2 py-0.5 rounded-md font-bold">ثابت</span>
                </div>
                <div class="space-y-1.5 text-xs border-t border-slate-100 dark:border-slate-800 pt-2">
                    <div class="flex justify-between items-center"><span class="text-slate-400">دولار:</span><span class="font-black text-brand-600 dark:text-brand-400 text-sm">535</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">سعودي:</span><span class="font-black text-brand-600 dark:text-brand-400 text-sm">140</span></div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-xs text-slate-700 dark:text-slate-300">🌊 عدن</span>
                    <span class="bg-amber-500/10 text-amber-600 dark:text-amber-400 text-[10px] px-2 py-0.5 rounded-md font-bold">متغير</span>
                </div>
                <div class="space-y-1.5 text-xs border-t border-slate-100 dark:border-slate-800 pt-2">
                    <div class="flex justify-between items-center"><span class="text-slate-400">دولار:</span><span class="font-black text-amber-600 dark:text-amber-400 text-sm">1,575</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">سعودي:</span><span class="font-black text-amber-600 dark:text-amber-400 text-sm">415</span></div>
                </div>
            </div>
        </div>

        <!-- حاسبة الصرف -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 space-y-3.5">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2.5">
                <h2 class="font-bold text-sm flex items-center gap-1.5 text-slate-800 dark:text-slate-200">
                    <i class="fa-solid fa-calculator text-brand-600"></i> الحاسبة الفورية
                </h2>
                <div class="flex gap-1">
                    <button onclick="setAmount(10)" class="px-2 py-1 bg-slate-100 dark:bg-slate-800 active:scale-95 rounded-lg text-[11px] font-bold">10</button>
                    <button onclick="setAmount(100)" class="px-2 py-1 bg-slate-100 dark:bg-slate-800 active:scale-95 rounded-lg text-[11px] font-bold">100</button>
                    <button onclick="setAmount(500)" class="px-2 py-1 bg-slate-100 dark:bg-slate-800 active:scale-95 rounded-lg text-[11px] font-bold">500</button>
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium mb-1 text-slate-400">المبلغ المراد تحويله</label>
                    <input type="number" id="amount" value="100" min="0" oninput="convertCurrency()" 
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-base font-bold">
                </div>

                <div class="space-y-2 relative">
                    <div>
                        <label class="block text-[11px] font-medium mb-1 text-slate-400">من عملة:</label>
                        <select id="from-currency" onchange="convertCurrency()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-brand-500 text-xs font-bold">
                            <option value="USD">🇺🇸 دولار أمريكي (USD)</option>
                            <option value="SAR">🇸🇦 ريال سعودي (SAR - )</option>
                            <option value="YER_SANAA">🏛️ ريال يمني (سعر صنعاء)</option>
                            <option value="YER_ADEN">🌊 ريال يمني (سعر عدن)</option>
                            <option value="EUR">🇪🇺 يورو (EUR - عالمي)</option>
                            <option value="EGP">🇪🇬 جنيه مصري (EGP - عالمي)</option>
                            <option value="AED">🇦🇪 درهم إماراتي (AED - عالمي)</option>
                            <option value="GBP">🇬🇧 جنيه استرليني (GBP - عالمي)</option>
                        </select>
                    </div>

                    <div class="flex justify-center -my-1 relative z-10">
                        <button onclick="swapCurrencies()" class="p-2.5 bg-slate-100 dark:bg-slate-800 active:scale-90 border border-slate-200 dark:border-slate-700 rounded-full text-brand-600" title="تبديل">
                            <i class="fa-solid fa-arrow-down-up text-xs"></i>
                        </button>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium mb-1 text-slate-400">إلى عملة:</label>
                        <select id="to-currency" onchange="convertCurrency()" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-brand-500 text-xs font-bold">
                            <option value="YER_SANAA" selected>🏛️ ريال يمني (سعر صنعاء)</option>
                            <option value="YER_ADEN">🌊 ريال يمني (سعر عدن)</option>
                            <option value="USD">🇺🇸 دولار أمريكي (USD)</option>
                            <option value="SAR">🇸🇦 ريال سعودي (SAR )</option>
                            <option value="EUR">🇪🇺 يورو (EUR - عالمي)</option>
                            <option value="EGP">🇪🇬 جنيه مصري (EGP - عالمي)</option>
                            <option value="AED">🇦🇪 درهم إماراتي (AED - عالمي)</option>
                            <option value="GBP">🇬🇧 جنيه استرليني (GBP - عالمي)</option>
                        </select>
                    </div>
                </div>

                <div class="bg-gradient-to-br from-brand-600 to-emerald-800 rounded-xl p-3.5 text-white flex justify-between items-center shadow-md">
                    <div>
                        <span class="text-[10px] text-emerald-100 block mb-0.5">النتيجة</span>
                        <div class="text-xl font-black tracking-wide" id="conversion-result">0.00</div>
                    </div>
                    <button onclick="copyResult()" class="bg-white/15 active:scale-95 px-3 py-2 rounded-lg text-xs flex items-center gap-1.5 font-medium">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copy-text">نسخ</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-[11px] text-slate-400 border-t border-slate-200/60 dark:border-slate-800/60">
        تطبيق صرافة اليمن المحمول 📱
    </footer>

    <!-- البرمجية والمنطق المحدث -->
    <script>
        // 1. توليد ملف manifest.json ديناميكياً داخل ذاكرة الصفحة
        const manifestData = {
            "name": "صرافة اليمن",
            "short_name": "صرافة اليمن",
            "description": "تطبيق أسعار الصرف وحاسبة تحويل العملات في صنعاء وعدن",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#16a34a",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/2489/2489756.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/2489/2489756.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkElem = document.createElement('link');
        linkElem.rel = 'manifest';
        linkElem.href = manifestURL;
        document.head.appendChild(linkElem);

        // 2. تسجيل Service Worker تلقائياً من الذاكرة (Blob)
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'yemen-ex-cache-v1';
                self.addEventListener('install', e => {
                    self.skipWaiting();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swURL = URL.createObjectURL(swBlob);

            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swURL)
                    .then(() => console.log('PWA Embedded Service Worker Ready'))
                    .catch(err => console.log('SW Error:', err));
            });
        }

        // أسعار الصرف المحلية الفعلية في اليمن (صنعاء / عدن)
        const LOCAL_RATES = {
            SANAA: { USD: 535.00, SAR: 140.00 },
            ADEN:  { USD: 1575.00, SAR: 415.00 }
        };

        // أسعار الصرف العالمية الفورية مقابل الدولار (يتم تحديثها من الإنترنت)
        let marketRates = { 
            USD: 1.00, 
            EUR: 0.92, 
            EGP: 48.50, 
            AED: 3.67, 
            GBP: 0.79 
        };

        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').classList.remove('hidden');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('install-banner').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        function dismissInstall() {
            document.getElementById('install-banner').classList.add('hidden');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        async function fetchLiveRates() {
            const refreshIcon = document.getElementById('refresh-icon');
            const updateStatus = document.getElementById('last-updated');
            refreshIcon.classList.add('animate-spin');

            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data && data.rates) {
                    marketRates = { ...marketRates, ...data.rates };
                    const now = new Date();
                    updateStatus.innerText = `تم التحديث: ${now.toLocaleTimeString('ar-YE', {hour: '2-digit', minute:'2-digit'})}`;
                }
            } catch (error) {
                updateStatus.innerText = "يعمل بالقيم المحفوظة محلياً";
            } finally {
                refreshIcon.classList.remove('animate-spin');
                convertCurrency();
            }
        }

        function setAmount(val) {
            document.getElementById('amount').value = val;
            convertCurrency();
        }

        function swapCurrencies() {
            const fromSelect = document.getElementById('from-currency');
            const toSelect = document.getElementById('to-currency');
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            convertCurrency();
        }

        function convertCurrency() {
            const amount = parseFloat(document.getElementById('amount').value);
            const from = document.getElementById('from-currency').value;
            const to = document.getElementById('to-currency').value;
            const resultBox = document.getElementById('conversion-result');

            if (isNaN(amount) || amount < 0) {
                resultBox.innerText = "أدخل مبلغ صحيح";
                return;
            }

            // 1. تحويل المبلغ المدخل من العملة "من" إلى الدولار الأمريكي كقناة وسيطة
            let amountInUSD = 0;
            if (from === 'USD') {
                amountInUSD = amount;
            } else if (from === 'SAR') {
                // استخدام سعر الريال السعودي المحلي في صنعاء كمرجع محلي للعملات الخليجية/المحلية
                amountInUSD = amount / (LOCAL_RATES.SANAA.USD / LOCAL_RATES.SANAA.SAR);
            } else if (from === 'YER_SANAA') {
                amountInUSD = amount / LOCAL_RATES.SANAA.USD;
            } else if (from === 'YER_ADEN') {
                amountInUSD = amount / LOCAL_RATES.ADEN.USD;
            } else {
                // بقية العملات حسب الصرف العالمي
                const rate = marketRates[from] || 1;
                amountInUSD = amount / rate;
            }

            // 2. تحويل المبلغ بالدولار إلى العملة المستهدفة "إلى"
            let finalResult = 0;
            let currencyLabel = to;

            if (to === 'USD') {
                finalResult = amountInUSD;
                currencyLabel = 'دولار أمريكي (USD)';
            } else if (to === 'SAR') {
                finalResult = amountInUSD * (LOCAL_RATES.SANAA.USD / LOCAL_RATES.SANAA.SAR);
                currencyLabel = 'ريال سعودي (SAR)';
            } else if (to === 'YER_SANAA') {
                finalResult = amountInUSD * LOCAL_RATES.SANAA.USD;
                currencyLabel = 'ريال يمني (صنعاء)';
            } else if (to === 'YER_ADEN') {
                finalResult = amountInUSD * LOCAL_RATES.ADEN.USD;
                currencyLabel = 'ريال يمني (عدن)';
            } else {
                // بقية العملات حسب الصرف العالمي
                const rate = marketRates[to] || 1;
                finalResult = amountInUSD * rate;
                if (to === 'EUR') currencyLabel = 'يورو (EUR)';
                else if (to === 'EGP') currencyLabel = 'جنيه مصري (EGP)';
                else if (to === 'AED') currencyLabel = 'درهم إماراتي (AED)';
                else if (to === 'GBP') currencyLabel = 'جنيه استرليني (GBP)';
            }

            const formattedResult = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(finalResult);
            resultBox.innerText = `${formattedResult} ${currencyLabel}`;
        }

        window.onload = fetchLiveRates;
    </script>
</body>
</html>
